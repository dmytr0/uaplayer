[project]
name = "uafix-player"
version = "1.1.3"
description = "Перегляд каталогу uafix.net і відтворення HLS-потоків"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "flet-video==1.0.4",
    "requests",
    "beautifulsoup4",
]

[tool.flet]
org = "net.uafix"
product = "UAFix Player"
company = "UAFix Player"
copyright = "UAFix Player"

[tool.flet.app]
path = "."
exclude = ["run.log", "run2.log", "README.md", ".github", "icon_options", "dist", "tools", "android_template", "CHANGELOG.md"]

[tool.flet.android]
# фон адаптивної іконки — як у самої іконки (інакше Flet підкладає білий і з'являється ореол);
# сама іконка — assets/icon_android.png на всю площу, зміст у безпечній зоні
adaptive_icon_background = "#15171C"

[tool.flet.android.permission]
# встановлення завантаженого застосунком оновлення (системне вікно «Встановити»)
"android.permission.REQUEST_INSTALL_PACKAGES" = true

# дозвіл на інтернет (android.permission.INTERNET) і мережевий доступ macOS Flet додає сам
